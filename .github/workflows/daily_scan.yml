name: Daily Taiwan Stock Scan

on:
  push:
    branches: [main]
    paths:
      - scanner.py
      - requirements.txt
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/charts data/signals.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update V6.5 scan data"
          git push
