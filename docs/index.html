<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>台股起漲雷達 V5</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07111f;
    color: #eef4ff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 16px;
}

.hero {
    padding: 18px 0 12px;
}

h1 {
    margin: 0;
    font-size: 27px;
}

.subtitle {
    color: #8fa7c6;
    margin-top: 6px;
    font-size: 14px;
}

.version {
    display: inline-block;
    margin-top: 9px;
    padding: 4px 9px;
    border-radius: 20px;
    background: #183457;
    font-size: 12px;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 16px 0;
}

.summary-card {
    background: #0d1c30;
    border: 1px solid #1d3655;
    border-radius: 14px;
    padding: 12px;
}

.summary-label {
    color: #8298b5;
    font-size: 12px;
}

.summary-value {
    font-size: 20px;
    font-weight: 700;
    margin-top: 4px;
}

.controls {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(7,17,31,.96);
    padding: 10px 0;
}

.search {
    width: 100%;
    border: 1px solid #244361;
    background: #0d1c30;
    color: white;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
}

.tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 10px;
    padding-bottom: 4px;
}

.tab {
    flex: 0 0 auto;
    border: 1px solid #294665;
    background: #10233a;
    color: #b9c9db;
    padding: 8px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
}

.tab.active {
    background: #246bfd;
    color: white;
    border-color: #246bfd;
}

.sector-select {
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    border-radius: 10px;
    background: #0d1c30;
    color: white;
    border: 1px solid #294665;
}

.stock-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.card {
    background: #0d1c30;
    border: 1px solid #1d3655;
    border-radius: 16px;
    padding: 15px;
}

.card-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.stock-name {
    font-size: 20px;
    font-weight: 750;
}

.stock-code {
    color: #8298b5;
    font-size: 13px;
    margin-top: 3px;
}

.rank {
    color: #82aaff;
    font-size: 13px;
    font-weight: 600;
}

.price {
    font-size: 22px;
    font-weight: 700;
    text-align: right;
}

.date {
    color: #8298b5;
    font-size: 11px;
    text-align: right;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 10px;
}

.tag {
    background: #142b47;
    color: #9dc7ff;
    border-radius: 12px;
    padding: 4px 8px;
    font-size: 11px;
}

.signal {
    margin: 12px 0;
    padding: 10px;
    border-radius: 10px;
    font-weight: 700;
    text-align: center;
}

.signal-buy {
    background: rgba(34,197,94,.15);
    color: #5ee58a;
    border: 1px solid rgba(34,197,94,.4);
}

.signal-wait {
    background: rgba(59,130,246,.15);
    color: #74aaff;
    border: 1px solid rgba(59,130,246,.4);
}

.signal-hot {
    background: rgba(239,68,68,.14);
    color: #ff8181;
    border: 1px solid rgba(239,68,68,.4);
}

.signal-low {
    background: rgba(148,163,184,.1);
    color: #aab6c6;
    border: 1px solid rgba(148,163,184,.25);
}

.score-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.score-box {
    background: #091726;
    border-radius: 10px;
    padding: 9px;
}

.score-title {
    font-size: 11px;
    color: #8198b5;
}

.score-value {
    font-size: 19px;
    font-weight: 700;
    margin-top: 2px;
}

.metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 10px;
}

.metric {
    background: #091726;
    padding: 8px;
    border-radius: 9px;
}

.metric-label {
    color: #738ba9;
    font-size: 10px;
}

.metric-value {
    margin-top: 3px;
    font-size: 13px;
    font-weight: 600;
}

.section-title {
    margin-top: 14px;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 700;
}

.reason {
    font-size: 12px;
    line-height: 1.55;
    padding: 3px 0;
    color: #c7d7e8;
}

.good {
    color: #62dc8c;
}

.risk {
    color: #ff9a9a;
}

.trigger {
    background: #112943;
    border-left: 3px solid #3b82f6;
    padding: 9px;
    margin-top: 11px;
    font-size: 12px;
    line-height: 1.5;
}

.chart-btn {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #17365a;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.chart-wrap {
    display: none;
    margin-top: 12px;
}

.chart-wrap.open {
    display: block;
}

canvas {
    width: 100%;
    height: 310px;
    background: #081522;
    border-radius: 10px;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 7px;
    font-size: 10px;
    color: #93a7bd;
}

.legend span::before {
    content: "●";
    margin-right: 4px;
}

.ma5 { color: #58a6ff; }
.ma10 { color: #f2cc60; }
.ma20 { color: #bc8cff; }
.ma60 { color: #ff9f43; }

.news-item {
    font-size: 12px;
    padding: 7px 0;
    border-bottom: 1px solid #17304c;
}

.empty {
    text-align: center;
    color: #849ab5;
    padding: 50px 0;
}

.footer {
    color: #6f849e;
    font-size: 11px;
    line-height: 1.6;
    margin: 25px 0;
}

@media(max-width: 760px) {
    .stock-grid {
        grid-template-columns: 1fr;
    }

    .summary {
        grid-template-columns: repeat(3, 1fr);
    }

    h1 {
        font-size: 24px;
    }

    .container {
        padding: 12px;
    }

    canvas {
        height: 280px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="hero">
        <h1>🚀 台股起漲雷達 V5</h1>

        <div class="subtitle">
            日K・短均線・RSI・MACD・量價・20日突破・族群雷達
        </div>

        <span class="version">
            V5 Launch Radar
        </span>
    </div>

    <div class="summary">

        <div class="summary-card">
            <div class="summary-label">掃描股票</div>
            <div class="summary-value" id="universeCount">-</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">今日候選</div>
            <div class="summary-value" id="selectedCount">-</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">進場訊號</div>
            <div class="summary-value" id="buyCount">-</div>
        </div>

    </div>

    <div class="subtitle" id="updated">
        資料載入中...
    </div>

    <div class="controls">

        <input
            class="search"
            id="searchInput"
            placeholder="搜尋股票名稱或代碼，例如：國巨 / 2327"
        >

        <div class="tabs">

            <button class="tab active" data-signal="all">
                全部
            </button>

            <button class="tab" data-signal="符合進場條件">
                🟢 進場條件
            </button>

            <button class="tab" data-signal="等待突破確認">
                🔵 等待突破
            </button>

            <button class="tab" data-signal="過熱／不追價">
                🔴 過熱
            </button>

            <button class="tab" data-signal="條件不足">
                ⚪ 觀察
            </button>

        </div>

        <select class="sector-select" id="sectorSelect">
            <option value="all">
                全部族群
            </option>
        </select>

    </div>

    <div id="stockGrid" class="stock-grid"></div>

    <div class="footer">
        Launch Score 與 Confidence 為技術條件評分，
        用來協助排序與觀察，不代表未來報酬率或保證上漲。

        <br><br>

        「符合進場條件」代表目前技術條件達到系統門檻；
        實際操作仍應觀察突破是否守穩、成交量是否延續，
        並自行評估風險。
    </div>

</div>

<script>

let DATA = null;
let stocks = [];

let activeSignal = "all";
let activeSector = "all";


/* ========================================================
   LOAD DATA
======================================================== */

async function loadData() {

    try {

        const response = await fetch(
            "data.json?t=" + Date.now()
        );

        DATA = await response.json();

        if (
            !DATA ||
            !Array.isArray(DATA.stocks)
        ) {
            throw new Error(
                "V5 data.json 格式錯誤"
            );
        }

        stocks = DATA.stocks;

        updateSummary();
        buildSectorOptions();
        render();

    } catch(error) {

        console.error(error);

        document.getElementById(
            "stockGrid"
        ).innerHTML = `
            <div class="empty">
                無法讀取 V5 data.json
                <br><br>
                請確認 GitHub Action 已成功執行 scanner.py
            </div>
        `;
    }
}


/* ========================================================
   SUMMARY
======================================================== */

function updateSummary() {

    document.getElementById(
        "universeCount"
    ).textContent =
        DATA.universe_count ?? "-";

    document.getElementById(
        "selectedCount"
    ).textContent =
        DATA.count ?? stocks.length;

    document.getElementById(
        "buyCount"
    ).textContent =
        DATA.signal_counts?.[
            "符合進場條件"
        ] ?? 0;

    document.getElementById(
        "updated"
    ).textContent =
        "最後更新：" +
        (DATA.updated || "-") +
        " ｜ " +
        (DATA.strategy || "");
}


/* ========================================================
   SECTOR OPTIONS
======================================================== */

function buildSectorOptions() {

    const select =
        document.getElementById(
            "sectorSelect"
        );

    const groups =
        DATA.group_counts || {};

    Object.entries(groups)
        .sort((a,b) => b[1] - a[1])
        .forEach(([group,count]) => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = group;

            option.textContent =
                `${group} (${count})`;

            select.appendChild(option);
        });
}


/* ========================================================
   FILTER
======================================================== */

function getFilteredStocks() {

    const keyword =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();

    return stocks.filter(stock => {

        if (
            activeSignal !== "all" &&
            stock.signal !== activeSignal
        ) {
            return false;
        }

        if (
            activeSector !== "all" &&
            !(stock.groups || []).includes(
                activeSector
            )
        ) {
            return false;
        }

        if (keyword) {

            const text =
                `${stock.code} ${stock.name}`
                .toLowerCase();

            if (!text.includes(keyword)) {
                return false;
            }
        }

        return true;
    });
}


/* ========================================================
   SIGNAL CLASS
======================================================== */

function signalClass(signal) {

    if (signal === "符合進場條件") {
        return "signal-buy";
    }

    if (signal === "等待突破確認") {
        return "signal-wait";
    }

    if (signal === "過熱／不追價") {
        return "signal-hot";
    }

    return "signal-low";
}


/* ========================================================
   HTML ESCAPE
======================================================== */

function esc(value) {

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}


/* ========================================================
   STOCK CARD
======================================================== */

function stockCard(stock) {

    const groups =
        (stock.groups || [])
        .map(
            group =>
                `<span class="tag">${esc(group)}</span>`
        )
        .join("");

    const positives =
        (
            stock.recommendation_reasons ||
            stock.launch_reasons ||
            []
        )
        .slice(0,6)
        .map(
            reason =>
                `<div class="reason good">
                    ✓ ${esc(reason)}
                </div>`
        )
        .join("");

    const risks =
        (stock.risk_reasons || [])
        .slice(0,5)
        .map(
            reason =>
                `<div class="reason risk">
                    △ ${esc(reason)}
                </div>`
        )
        .join("");

    let newsHtml = "";

    if (
        Array.isArray(stock.news) &&
        stock.news.length
    ) {

        newsHtml = `
            <div class="section-title">
                📰 最新消息
            </div>

            ${
                stock.news
                .slice(0,3)
                .map(
                    item => `
                        <div class="news-item">
                            ${esc(
                                item.title || item
                            )}
                        </div>
                    `
                )
                .join("")
            }
        `;
    }

    const canvasId =
        "chart-" + stock.code;

    const wrapId =
        "wrap-" + stock.code;

    return `

    <div class="card">

        <div class="card-top">

            <div>

                <div class="rank">
                    #${stock.rank ?? "-"}
                </div>

                <div class="stock-name">
                    ${esc(stock.name)}
                </div>

                <div class="stock-code">
                    ${esc(stock.code)}
                    ・
                    ${esc(stock.market)}
                </div>

            </div>

            <div>

                <div class="price">
                    ${Number(
                        stock.price
                    ).toFixed(2)}
                </div>

                <div class="date">
                    ${esc(stock.date)}
                </div>

            </div>

        </div>

        <div class="tags">
            ${groups}
        </div>

        <div
            class="
                signal
                ${signalClass(stock.signal)}
            ">
            ${esc(stock.signal)}
        </div>

        <div class="score-row">

            <div class="score-box">
                <div class="score-title">
                    Launch Score
                </div>
                <div class="score-value">
                    ${stock.launch_score}
                </div>
            </div>

            <div class="score-box">
                <div class="score-title">
                    Confidence
                </div>
                <div class="score-value">
                    ${stock.confidence}%
                </div>
            </div>

        </div>

        <div class="metrics">

            <div class="metric">
                <div class="metric-label">
                    RSI14
                </div>
                <div class="metric-value">
                    ${stock.rsi}
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    Volume
                </div>
                <div class="metric-value">
                    ${stock.volume_ratio}x
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    MA20乖離
                </div>
                <div class="metric-value">
                    ${stock.distance_ma20_pct}%
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    MA5
                </div>
                <div class="metric-value">
                    ${stock.ma5}
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    MA10
                </div>
                <div class="metric-value">
                    ${stock.ma10}
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    MA20
                </div>
                <div class="metric-value">
                    ${stock.ma20}
                </div>
            </div>

        </div>

        <div class="section-title">
            🎯 關鍵價位
        </div>

        <div class="metrics">

            <div class="metric">
                <div class="metric-label">
                    20日突破價
                </div>
                <div class="metric-value">
                    ${stock.breakout_price}
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    觀察區間
                </div>
                <div class="metric-value">
                    ${stock.entry_low}
                    ~
                    ${stock.entry_high}
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    ATR風險參考
                </div>
                <div class="metric-value">
                    ${stock.risk_reference}
                </div>
            </div>

        </div>

        ${
            positives
            ? `
            <div class="section-title">
                💡 為什麼入選
            </div>
            ${positives}
            `
            : ""
        }

        ${
            risks
            ? `
            <div class="section-title">
                ⚠️ 目前風險
            </div>
            ${risks}
            `
            : ""
        }

        <div class="trigger">
            <b>下一步觀察：</b>
            ${esc(stock.trigger)}
        </div>

        ${newsHtml}

        <button
            class="chart-btn"
            onclick="toggleChart('${stock.code}')">
            📈 查看 90 日 K 線
        </button>

        <div
            class="chart-wrap"
            id="${wrapId}">

            <canvas id="${canvasId}">
            </canvas>

            <div class="legend">
                <span class="ma5">MA5</span>
                <span class="ma10">MA10</span>
                <span class="ma20">MA20</span>
                <span class="ma60">MA60</span>
            </div>

        </div>

    </div>
    `;
}


/* ========================================================
   RENDER
======================================================== */

function render() {

    const filtered =
        getFilteredStocks();

    const grid =
        document.getElementById(
            "stockGrid"
        );

    if (filtered.length === 0) {

        grid.innerHTML = `
            <div class="empty">
                沒有符合目前篩選條件的股票
            </div>
        `;

        return;
    }

    grid.innerHTML =
        filtered
        .map(stockCard)
        .join("");
}


/* ========================================================
   K LINE
======================================================== */

function toggleChart(code) {

    const stock =
        stocks.find(
            s => s.code === code
        );

    if (!stock) {
        return;
    }

    const wrap =
        document.getElementById(
            "wrap-" + code
        );

    const canvas =
        document.getElementById(
            "chart-" + code
        );

    const opening =
        !wrap.classList.contains(
            "open"
        );

    wrap.classList.toggle(
        "open"
    );

    if (opening) {

        setTimeout(() => {
            drawChart(
                canvas,
                stock.chart || []
            );
        }, 50);
    }
}


/* ========================================================
   DRAW DAILY CANDLESTICK
======================================================== */

function drawChart(canvas,data) {

    if (!data || data.length < 2) {
        return;
    }

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    const ctx =
        canvas.getContext("2d");

    ctx.scale(dpr,dpr);

    const W = rect.width;
    const H = rect.height;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    const pad = {
        left: 42,
        right: 10,
        top: 15,
        bottom: 65
    };

    const chartH =
        H -
        pad.top -
        pad.bottom;

    const priceH =
        chartH * 0.76;

    const volumeH =
        chartH * 0.20;

    const priceValues = [];

    data.forEach(d => {

        priceValues.push(
            d.high,
            d.low
        );

        [
            d.ma5,
            d.ma10,
            d.ma20,
            d.ma60
        ]
        .forEach(v => {

            if (
                v &&
                Number.isFinite(
                    Number(v)
                )
            ) {
                priceValues.push(
                    Number(v)
                );
            }
        });
    });

    const minPrice =
        Math.min(...priceValues);

    const maxPrice =
        Math.max(...priceValues);

    const range =
        maxPrice - minPrice || 1;

    const maxVolume =
        Math.max(
            ...data.map(
                d => d.volume || 0
            ),
            1
        );

    function yPrice(value) {

        return (
            pad.top +
            (maxPrice - value)
            / range
            * priceH
        );
    }

    const usableW =
        W -
        pad.left -
        pad.right;

    const step =
        usableW /
        data.length;

    const candleWidth =
        Math.max(
            2,
            Math.min(
                7,
                step * .62
            )
        );

    /* GRID */

    ctx.strokeStyle =
        "rgba(130,150,175,.15)";

    ctx.lineWidth = 1;

    ctx.font =
        "10px -apple-system";

    ctx.fillStyle =
        "#7890aa";

    for (
        let i = 0;
        i <= 4;
        i++
    ) {

        const y =
            pad.top +
            priceH *
            i / 4;

        ctx.beginPath();

        ctx.moveTo(
            pad.left,
            y
        );

        ctx.lineTo(
            W - pad.right,
            y
        );

        ctx.stroke();

        const price =
            maxPrice -
            range *
            i / 4;

        ctx.fillText(
            price.toFixed(1),
            2,
            y + 3
        );
    }

    /* CANDLES */

    data.forEach((d,i) => {

        const x =
            pad.left +
            step *
            (i + .5);

        const open =
            Number(d.open);

        const close =
            Number(d.close);

        const high =
            Number(d.high);

        const low =
            Number(d.low);

        const up =
            close >= open;

        ctx.strokeStyle =
            up
            ? "#ef5350"
            : "#26a69a";

        ctx.fillStyle =
            up
            ? "#ef5350"
            : "#26a69a";

        ctx.beginPath();

        ctx.moveTo(
            x,
            yPrice(high)
        );

        ctx.lineTo(
            x,
            yPrice(low)
        );

        ctx.stroke();

        const yOpen =
            yPrice(open);

        const yClose =
            yPrice(close);

        const top =
            Math.min(
                yOpen,
                yClose
            );

        const bodyH =
            Math.max(
                1,
                Math.abs(
                    yClose -
                    yOpen
                )
            );

        ctx.fillRect(
            x -
            candleWidth / 2,
            top,
            candleWidth,
            bodyH
        );
    });

    /* MA */

    function drawMA(key,color) {

        ctx.strokeStyle = color;
        ctx.lineWidth = 1.4;

        ctx.beginPath();

        let started = false;

        data.forEach((d,i) => {

            const value =
                Number(d[key]);

            if (
                !value ||
                !Number.isFinite(value)
            ) {
                return;
            }

            const x =
                pad.left +
                step *
                (i + .5);

            const y =
                yPrice(value);

            if (!started) {

                ctx.moveTo(x,y);
                started = true;

            } else {

                ctx.lineTo(x,y);
            }
        });

        ctx.stroke();
    }

    drawMA(
        "ma5",
        "#58a6ff"
    );

    drawMA(
        "ma10",
        "#f2cc60"
    );

    drawMA(
        "ma20",
        "#bc8cff"
    );

    drawMA(
        "ma60",
        "#ff9f43"
    );

    /* VOLUME */

    const volumeTop =
        pad.top +
        priceH +
        14;

    data.forEach((d,i) => {

        const x =
            pad.left +
            step *
            (i + .5);

        const h =
            (
                Number(d.volume)
                /
                maxVolume
            )
            *
            volumeH;

        const up =
            Number(d.close)
            >=
            Number(d.open);

        ctx.fillStyle =
            up
            ? "rgba(239,83,80,.45)"
            : "rgba(38,166,154,.45)";

        ctx.fillRect(
            x -
            candleWidth / 2,
            volumeTop +
            volumeH -
            h,
            candleWidth,
            h
        );
    });
}


/* ========================================================
   EVENTS
======================================================== */

document
.getElementById(
    "searchInput"
)
.addEventListener(
    "input",
    render
);

document
.getElementById(
    "sectorSelect"
)
.addEventListener(
    "change",
    event => {

        activeSector =
            event.target.value;

        render();
    }
);

document
.querySelectorAll(
    ".tab"
)
.forEach(tab => {

    tab.addEventListener(
        "click",
        () => {

            document
                .querySelectorAll(
                    ".tab"
                )
                .forEach(
                    item =>
                        item.classList.remove(
                            "active"
                        )
                );

            tab.classList.add(
                "active"
            );

            activeSignal =
                tab.dataset.signal;

            render();
        }
    );
});


/* ========================================================
   START
======================================================== */

loadData();

</script>
