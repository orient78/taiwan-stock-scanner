<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>台股科技選股 V3</title>

<style>
:root {
    --bg: #0b1220;
    --card: #131d2e;
    --card2: #182438;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --line: #263449;
    --accent: #38bdf8;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px 14px 50px;
}

h1 {
    margin: 4px 0 6px;
    font-size: 28px;
}

.subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 18px;
}

/* summary */

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
}

.summary-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
}

.summary-label {
    color: var(--muted);
    font-size: 12px;
}

.summary-value {
    font-size: 19px;
    font-weight: 700;
    margin-top: 5px;
}

/* filters */

.filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 18px;
    scrollbar-width: none;
}

.filters::-webkit-scrollbar {
    display: none;
}

.filter-btn {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
}

.filter-btn.active {
    background: var(--accent);
    color: #00131f;
    border-color: var(--accent);
    font-weight: 700;
}

/* section */

.section {
    margin-top: 24px;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 10px;
}

.section-count {
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
}

/* stocks */

.stock-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
}

.stock-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 15px;
}

.stock-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}

.stock-name {
    font-size: 18px;
    font-weight: 700;
}

.stock-code {
    color: var(--muted);
    font-size: 13px;
    margin-top: 3px;
}

.score {
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 9px;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
}

.score.high {
    color: var(--green);
}

.price {
    font-size: 24px;
    font-weight: 750;
    margin: 13px 0 9px;
}

.groups {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 11px;
}

.group {
    font-size: 11px;
    padding: 4px 7px;
    border-radius: 8px;
    background: #203047;
    color: #cbd5e1;
}

.ma-pass {
    background: rgba(34,197,94,.12);
    color: #4ade80;
    border: 1px solid rgba(34,197,94,.25);
    padding: 7px 9px;
    border-radius: 9px;
    font-size: 12px;
    margin-bottom: 10px;
}

/* metrics */

.metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin: 10px 0;
}

.metric {
    background: var(--card2);
    border-radius: 9px;
    padding: 8px;
}

.metric-label {
    color: var(--muted);
    font-size: 10px;
}

.metric-value {
    font-size: 13px;
    font-weight: 650;
    margin-top: 3px;
}

/* moving averages */

.ma-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 9px;
}

.ma-box {
    text-align: center;
    background: #101827;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 7px 4px;
}

.ma-title {
    color: var(--muted);
    font-size: 10px;
}

.ma-value {
    font-size: 12px;
    margin-top: 2px;
}

/* reasons */

.reasons {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 11px;
}

.reason {
    font-size: 10px;
    padding: 4px 6px;
    background: rgba(56,189,248,.11);
    color: #7dd3fc;
    border-radius: 6px;
}

.stock-footer {
    margin-top: 11px;
    padding-top: 9px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 10px;
    display: flex;
    justify-content: space-between;
}

.empty {
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 20px;
    color: var(--muted);
    text-align: center;
}

.note {
    margin-top: 28px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
    text-align: center;
}

@media (max-width: 600px) {
    .summary {
        grid-template-columns: repeat(3, 1fr);
    }

    .summary-card {
        padding: 11px 8px;
    }

    .summary-value {
        font-size: 15px;
    }

    h1 {
        font-size: 24px;
    }

    .stock-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🚀 台股科技選股 V3</h1>

    <div class="subtitle">
        AI・半導體・科技・ETF 技術面掃描
    </div>

    <div class="summary">

        <div class="summary-card">
            <div class="summary-label">最後更新</div>
            <div class="summary-value" id="updated">--</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">掃描標的</div>
            <div class="summary-value" id="universe">--</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">目前入選</div>
            <div class="summary-value" id="selected">--</div>
        </div>

    </div>

    <div class="filters">

        <button
            class="filter-btn active"
            data-group="全部">
            全部
        </button>

        <button
            class="filter-btn"
            data-group="AI">
            🤖 AI
        </button>

        <button
            class="filter-btn"
            data-group="半導體">
            🧠 半導體
        </button>

        <button
            class="filter-btn"
            data-group="科技">
            💻 科技
        </button>

        <button
            class="filter-btn"
            data-group="ETF">
            📊 ETF
        </button>

    </div>

    <div id="content"></div>

    <div class="note">
        V3 技術條件：
        MA5 / MA10 / MA20、
        MA20 / MA60、
        RSI14、MACD、
        20 日突破與成交量。<br>
        本頁僅提供技術面篩選結果，
        不代表投資建議。
    </div>

</div>


<script>

let allStocks = [];
let currentGroup = "全部";


function formatNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "--";
    }

    return value;
}


function stockCard(stock) {

    const groups =
        (stock.groups || [])
        .map(
            g => `<span class="group">${g}</span>`
        )
        .join("");

    const reasons =
        (stock.reasons || [])
        .map(
            r => `<span class="reason">${r}</span>`
        )
        .join("");

    const maPass =
        stock.above_3ma
        ? `
        <div class="ma-pass">
            ✓ 站上 MA5 / MA10 / MA20
        </div>
        `
        : "";

    const scoreClass =
        stock.score >= 5
        ? "score high"
        : "score";

    return `

    <div class="stock-card">

        <div class="stock-top">

            <div>

                <div class="stock-name">
                    ${stock.name}
                </div>

                <div class="stock-code">
                    ${stock.code}
                    ・${stock.market}
                </div>

            </div>

            <div class="${scoreClass}">
                ${stock.score}/6
            </div>

        </div>

        <div class="price">
            $${formatNumber(stock.price)}
        </div>

        <div class="groups">
            ${groups}
        </div>

        ${maPass}

        <div class="metrics">

            <div class="metric">
                <div class="metric-label">
                    RSI14
                </div>
                <div class="metric-value">
                    ${formatNumber(stock.rsi)}
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    量比
                </div>
                <div class="metric-value">
                    ${formatNumber(stock.volume_ratio)}x
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    MA60
                </div>
                <div class="metric-value">
                    ${formatNumber(stock.ma60)}
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    ATR14
                </div>
                <div class="metric-value">
                    ${formatNumber(stock.atr14)}
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    Risk Ref
                </div>
                <div class="metric-value">
                    ${formatNumber(stock.risk_reference)}
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    日期
                </div>
                <div class="metric-value">
                    ${formatNumber(stock.date)}
                </div>
            </div>

        </div>

        <div class="ma-grid">

            <div class="ma-box">
                <div class="ma-title">MA5</div>
                <div class="ma-value">
                    ${formatNumber(stock.ma5)}
                </div>
            </div>

            <div class="ma-box">
                <div class="ma-title">MA10</div>
                <div class="ma-value">
                    ${formatNumber(stock.ma10)}
                </div>
            </div>

            <div class="ma-box">
                <div class="ma-title">MA20</div>
                <div class="ma-value">
                    ${formatNumber(stock.ma20)}
                </div>
            </div>

        </div>

        <div class="reasons">
            ${reasons}
        </div>

        <div class="stock-footer">

            <span>
                ${stock.category}
            </span>

            <span>
                ${stock.is_etf ? "ETF" : "Stock"}
            </span>

        </div>

    </div>

    `;
}


function renderSection(
    title,
    emoji,
    category,
    stocks
) {

    const filtered =
        stocks.filter(
            s => s.category === category
        );

    if (!filtered.length) {
        return "";
    }

    return `

    <div class="section">

        <div class="section-title">

            <span>
                ${emoji} ${title}
            </span>

            <span class="section-count">
                ${filtered.length} 檔
            </span>

        </div>

        <div class="stock-grid">

            ${
                filtered
                .map(stockCard)
                .join("")
            }

        </div>

    </div>

    `;
}


function render() {

    let stocks = allStocks;

    if (currentGroup !== "全部") {

        stocks =
            allStocks.filter(
                stock =>
                    (stock.groups || [])
                    .includes(currentGroup)
            );
    }

    let html = "";

    html += renderSection(
        "強勢突破",
        "🔥",
        "強勢突破",
        stocks
    );

    html += renderSection(
        "多頭趨勢",
        "📈",
        "多頭趨勢",
        stocks
    );

    html += renderSection(
        "觀察名單",
        "👀",
        "觀察名單",
        stocks
    );

    if (!html) {

        html = `
        <div class="empty">
            目前這個分類沒有符合
            3 分以上條件的標的。
        </div>
        `;
    }

    document.getElementById(
        "content"
    ).innerHTML = html;
}


document
.querySelectorAll(".filter-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(
                ".filter-btn"
            )
            .forEach(
                b =>
                    b.classList.remove(
                        "active"
                    )
            );

            button.classList.add(
                "active"
            );

            currentGroup =
                button.dataset.group;

            render();
        }
    );

});


fetch(
    "data.json?ts=" +
    Date.now()
)
.then(response => {

    if (!response.ok) {
        throw new Error(
            "data.json load failed"
        );
    }

    return response.json();
})
.then(data => {

    allStocks =
        data.stocks || [];

    document.getElementById(
        "updated"
    ).textContent =
        data.updated || "--";

    document.getElementById(
        "universe"
    ).textContent =
        data.universe_count ?? "--";

    document.getElementById(
        "selected"
    ).textContent =
        data.count ?? 0;

    render();
})
.catch(error => {

    console.error(error);

    document.getElementById(
        "content"
    ).innerHTML = `
        <div class="empty">
            ⚠️ 無法載入選股資料
        </div>
    `;
});

</script>

</body>
</html>
