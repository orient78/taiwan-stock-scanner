<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股起漲雷達 V4</title>

<style>
:root{
  --bg:#0b1220;
  --card:#131d2e;
  --card2:#19263a;
  --line:#293a52;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --blue:#38bdf8;
  --green:#22c55e;
  --yellow:#f59e0b;
  --orange:#fb923c;
  --red:#ef4444;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:24px 14px 70px;
}

.hero{
  text-align:center;
  padding:20px 0 8px;
}

.hero h1{
  margin:0;
  font-size:28px;
}

.hero p{
  color:var(--muted);
  margin:10px 0;
}

.refresh{
  width:100%;
  max-width:500px;
  margin:25px auto;
  display:block;
  border:0;
  border-radius:15px;
  padding:16px;
  background:var(--blue);
  color:#07111d;
  font-size:18px;
  font-weight:900;
}

.refresh:disabled{opacity:.6}

#status{
  text-align:center;
  color:var(--muted);
  min-height:24px;
  margin-top:-15px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:28px 0 20px;
}

.box{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px 8px;
  text-align:center;
}

.box strong{
  display:block;
  font-size:20px;
}

.box span{
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
}

.tabs{
  display:flex;
  overflow-x:auto;
  gap:8px;
  margin-bottom:14px;
  padding-bottom:4px;
}

.tabs::-webkit-scrollbar{display:none}

.tab{
  flex:none;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--muted);
  border-radius:22px;
  padding:10px 14px;
  font-weight:800;
  font-size:13px;
}

.tab.active{
  background:var(--blue);
  color:#06111c;
  border-color:var(--blue);
}

.search{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  font-size:15px;
  outline:none;
  margin-bottom:18px;
}

.heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 3px 12px;
}

.heading h2{
  font-size:20px;
  margin:0;
}

#count{
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:13px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.name{
  font-size:21px;
  font-weight:900;
}

.code{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.price{
  font-size:22px;
  font-weight:900;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:12px 0;
}

.tag{
  background:#20314a;
  border-radius:8px;
  padding:5px 8px;
  color:#cbd5e1;
  font-size:11px;
}

.scores{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.metric{
  background:var(--card2);
  border-radius:12px;
  padding:11px;
}

.metric small{
  display:block;
  color:var(--muted);
  margin-bottom:4px;
}

.metric strong{
  font-size:20px;
}

.launch{color:var(--blue)}
.star{color:#facc15}

.signal{
  margin-top:11px;
  padding:11px;
  border-radius:11px;
  font-weight:900;
}

.buy{
  color:#86efac;
  background:rgba(34,197,94,.13);
}

.wait{
  color:#fde68a;
  background:rgba(245,158,11,.13);
}

.hot{
  color:#fdba74;
  background:rgba(251,146,60,.13);
}

.weak{
  color:#fca5a5;
  background:rgba(239,68,68,.12);
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:11px;
}

.stat{
  background:var(--card2);
  border-radius:10px;
  padding:9px;
  color:var(--muted);
  font-size:12px;
}

.stat strong{
  color:var(--text);
  display:block;
  margin-top:3px;
}

.reasons{
  color:#cbd5e1;
  font-size:12px;
  line-height:1.7;
  margin-top:12px;
}

.chartBtn{
  width:100%;
  border:1px solid var(--line);
  background:var(--card2);
  color:var(--blue);
  border-radius:11px;
  padding:11px;
  font-weight:900;
  margin-top:13px;
}

.chartBox{
  display:none;
  margin-top:12px;
}

.chartBox.show{display:block}

canvas{
  width:100%;
  height:280px;
  background:#0a1422;
  border-radius:10px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px;
  color:var(--muted);
}

.note{
  color:var(--muted);
  text-align:center;
  line-height:1.6;
  font-size:11px;
  margin-top:30px;
}

@media(max-width:500px){
  .wrap{padding:15px 11px 60px}
  .grid{grid-template-columns:1fr}
  .hero h1{font-size:25px}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="hero">
    <h1>🚀 台股起漲雷達 V4</h1>
    <p>技術結構・突破準備・量價動能・信心評比</p>
  </div>

  <button id="refreshBtn" class="refresh" onclick="refreshStocks()">
    🔄 立即更新選股
  </button>

  <div id="status"></div>

  <div class="summary">
    <div class="box">
      <strong id="updated">--</strong>
      <span>最後更新</span>
    </div>

    <div class="box">
      <strong id="universe">--</strong>
      <span>掃描股票</span>
    </div>

    <div class="box">
      <strong id="selected">--</strong>
      <span>入選股票</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-filter="all">🚀 起漲雷達</button>
    <button class="tab" data-filter="符合進場條件">🟢 技術條件完整</button>
    <button class="tab" data-filter="等待突破確認">🟡 等待突破</button>
    <button class="tab" data-filter="過熱／不追價">⚠️ 過熱</button>
    <button class="tab" data-filter="AI">🤖 AI</button>
    <button class="tab" data-filter="半導體">🧠 半導體</button>
    <button class="tab" data-filter="科技">💻 科技</button>
    <button class="tab" data-filter="ETF">📊 ETF</button>
  </div>

  <input id="search" class="search" placeholder="搜尋股票名稱或代號">

  <div class="heading">
    <h2 id="title">🚀 起漲雷達</h2>
    <span id="count"></span>
  </div>

  <div id="grid" class="grid">
    <div class="empty">資料讀取中...</div>
  </div>

  <div class="note">
    Launch Score 與 Confidence 為技術條件一致程度，
    不代表未來上漲機率或報酬保證。資料僅供研究參考。
  </div>

</div>

<script>
"use strict";

var stocks = [];
var filter = "all";
var keyword = "";

function safe(v, fallback){
  if(v === null || v === undefined || v === ""){
    return fallback === undefined ? "--" : fallback;
  }
  return v;
}

function stars(n){
  n = Number(n || 0);
  n = Math.max(0, Math.min(5, n));
  return "★".repeat(n) + "☆".repeat(5-n);
}

function signalInfo(signal){
  if(signal === "符合進場條件"){
    return {
      cls:"buy",
      text:"🟢 技術條件完整"
    };
  }

  if(signal === "等待突破確認"){
    return {
      cls:"wait",
      text:"🟡 等待突破確認"
    };
  }

  if(signal === "過熱／不追價"){
    return {
      cls:"hot",
      text:"🟠 過熱／不追價"
    };
  }

  return {
    cls:"weak",
    text:"🔴 條件不足"
  };
}

async function loadData(){
  try{
    var response = await fetch(
      "./data.json?v=" + Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    var data = await response.json();

    if(!data || !Array.isArray(data.stocks)){
      throw new Error("V4 data.json 格式錯誤");
    }

    stocks = data.stocks;

    document.getElementById("updated").textContent =
      safe(data.updated);

    document.getElementById("universe").textContent =
      safe(data.universe_count);

    document.getElementById("selected").textContent =
      safe(data.count, stocks.length);

    render();

  }catch(err){
    console.error(err);

    document.getElementById("grid").innerHTML =
      '<div class="empty">❌ data.json 載入失敗：' +
      escapeHtml(err.message) +
      '</div>';
  }
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function filteredStocks(){
  var result = stocks.filter(function(s){

    var matchFilter = false;

    if(filter === "all"){
      matchFilter = true;
    }
    else if(
      filter === "符合進場條件" ||
      filter === "等待突破確認" ||
      filter === "過熱／不追價" ||
      filter === "條件不足"
    ){
      matchFilter = s.signal === filter;
    }
    else{
      matchFilter =
        Array.isArray(s.groups) &&
        s.groups.indexOf(filter) !== -1;
    }

    var text =
      String(s.code || "") + " " +
      String(s.name || "");

    var matchSearch =
      text.toLowerCase().indexOf(
        keyword.toLowerCase()
      ) !== -1;

    return matchFilter && matchSearch;
  });

  result.sort(function(a,b){
    var launchDiff =
      Number(b.launch_score || 0) -
      Number(a.launch_score || 0);

    if(launchDiff !== 0){
      return launchDiff;
    }

    return (
      Number(b.confidence || 0) -
      Number(a.confidence || 0)
    );
  });

  return result;
}

function render(){
  var list = filteredStocks();
  var grid = document.getElementById("grid");

  document.getElementById("count").textContent =
    list.length + " 檔";

  if(list.length === 0){
    grid.innerHTML =
      '<div class="empty">沒有符合條件的股票</div>';
    return;
  }

  grid.innerHTML = list.map(function(s,index){

    var info = signalInfo(s.signal);

    var tags = (s.groups || []).map(function(g){
      return '<span class="tag">' +
        escapeHtml(g) +
        '</span>';
    }).join("");

    var reasons =
      (s.launch_reasons || s.reasons || [])
      .slice(0,6)
      .map(function(r){
        return "✓ " + escapeHtml(r);
      })
      .join("　");

    var chartId =
      "chart_" + s.code + "_" + index;

    var boxId =
      "chartbox_" + s.code + "_" + index;

    return `
      <div class="card">

        <div class="top">
          <div>
            <div class="name">
              ${escapeHtml(s.name)}
            </div>

            <div class="code">
              ${escapeHtml(s.code)}
              ・
              ${escapeHtml(s.market || "")}
            </div>
          </div>

          <div>
            <div class="price">
              $${safe(s.price)}
            </div>

            <div class="code">
              ${safe(s.date)}
            </div>
          </div>
        </div>

        <div class="tags">
          ${tags}
          <span class="tag">
            基礎技術 ${safe(s.score,0)}/6
          </span>
        </div>

        <div class="scores">

          <div class="metric">
            <small>🚀 Launch Score</small>
            <strong class="launch">
              ${safe(s.launch_score,0)}/100
            </strong>
          </div>

          <div class="metric">
            <small>⭐ 信心評比</small>
            <strong>
              ${safe(s.confidence,0)}/100
            </strong>

            <div class="star">
              ${stars(s.confidence_stars)}
            </div>
          </div>

        </div>

        <div class="signal ${info.cls}">
          ${info.text}
        </div>

        <div class="stats">

          <div class="stat">
            RSI14
            <strong>${safe(s.rsi)}</strong>
          </div>

          <div class="stat">
            量比
            <strong>${safe(s.volume_ratio)}x</strong>
          </div>

          <div class="stat">
            MA20 乖離
            <strong>${safe(s.distance_ma20_pct)}%</strong>
          </div>

          <div class="stat">
            突破參考
            <strong>$${safe(s.breakout_price)}</strong>
          </div>

          <div class="stat">
            技術參考區間
            <strong>
              $${safe(s.entry_low)}
              ～ $${safe(s.entry_high)}
            </strong>
          </div>

          <div class="stat">
            ATR 風險參考
            <strong>$${safe(s.risk_reference)}</strong>
          </div>

        </div>

        <div class="reasons">
          ${reasons}
        </div>

        <button
          class="chartBtn"
          onclick="toggleChart('${boxId}','${chartId}','${s.code}')"
        >
          📈 查看 60 日 K 線
        </button>

        <div id="${boxId}" class="chartBox">
          <canvas id="${chartId}"></canvas>
        </div>

      </div>
    `;

  }).join("");
}

function toggleChart(boxId,canvasId,code){
  var box = document.getElementById(boxId);

  if(!box){
    return;
  }

  box.classList.toggle("show");

  if(!box.classList.contains("show")){
    return;
  }

  var stock = stocks.find(function(s){
    return String(s.code) === String(code);
  });

  if(!stock){
    return;
  }

  setTimeout(function(){
    drawChart(canvasId, stock.chart || []);
  },50);
}

function drawChart(canvasId,data){
  var canvas = document.getElementById(canvasId);

  if(!canvas || !Array.isArray(data) || data.length === 0){
    return;
  }

  var rect = canvas.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;

  canvas.width = Math.round(rect.width*dpr);
  canvas.height = Math.round(rect.height*dpr);

  var ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);

  var W = rect.width;
  var H = rect.height;

  ctx.clearRect(0,0,W,H);

  var left = 42;
  var right = 8;
  var top = 12;
  var bottom = 24;

  var priceBottom = H * 0.76;
  var chartW = W-left-right;

  var prices = [];

  data.forEach(function(d){
    ["high","low","ma5","ma10","ma20","ma60"]
    .forEach(function(k){
      var v = Number(d[k]);
      if(Number.isFinite(v)){
        prices.push(v);
      }
    });
  });

  if(prices.length === 0){
    return;
  }

  var min = Math.min.apply(null,prices);
  var max = Math.max.apply(null,prices);
  var range = Math.max(max-min,1);

  min -= range*.05;
  max += range*.05;

  function py(v){
    return top +
      (max-v)/(max-min) *
      (priceBottom-top);
  }

  var step = chartW/data.length;
  var cw = Math.max(2,Math.min(7,step*.58));

  ctx.font = "10px -apple-system";
  ctx.fillStyle = "#94a3b8";

  for(var g=0;g<=4;g++){
    var gy =
      top+(priceBottom-top)*g/4;

    ctx.strokeStyle =
      "rgba(148,163,184,.12)";

    ctx.beginPath();
    ctx.moveTo(left,gy);
    ctx.lineTo(W-right,gy);
    ctx.stroke();

    var label =
      max-(max-min)*g/4;

    ctx.fillText(
      label.toFixed(1),
      2,
      gy+3
    );
  }

  var maxVolume = Math.max.apply(
    null,
    data.map(function(d){
      return Number(d.volume || 0);
    }).concat([1])
  );

  var volTop = priceBottom+8;
  var volHeight = H-bottom-volTop;

  data.forEach(function(d,i){
    var x = left+i*step+step/2;
    var volume = Number(d.volume || 0);
    var vh = volume/maxVolume*volHeight;

    var up =
      Number(d.close) >= Number(d.open);

    ctx.fillStyle =
      up
      ? "rgba(34,197,94,.35)"
      : "rgba(239,68,68,.35)";

    ctx.fillRect(
      x-cw/2,
      H-bottom-vh,
      cw,
      vh
    );
  });

  data.forEach(function(d,i){
    var o = Number(d.open);
    var h = Number(d.high);
    var l = Number(d.low);
    var c = Number(d.close);

    if(
      !Number.isFinite(o) ||
      !Number.isFinite(h) ||
      !Number.isFinite(l) ||
      !Number.isFinite(c)
    ){
      return;
    }

    var x = left+i*step+step/2;
    var up = c>=o;

    ctx.strokeStyle =
      up ? "#22c55e" : "#ef4444";

    ctx.fillStyle = ctx.strokeStyle;

    ctx.beginPath();
    ctx.moveTo(x,py(h));
    ctx.lineTo(x,py(l));
    ctx.stroke();

    var y1 = py(o);
    var y2 = py(c);

    ctx.fillRect(
      x-cw/2,
      Math.min(y1,y2),
      cw,
      Math.max(1,Math.abs(y1-y2))
    );
  });

  function ma(key,color){
    ctx.beginPath();
    ctx.strokeStyle=color;
    ctx.lineWidth=1.5;

    var started=false;

    data.forEach(function(d,i){
      var v=Number(d[key]);

      if(!Number.isFinite(v)){
        return;
      }

      var x=left+i*step+step/2;
      var y=py(v);

      if(!started){
        ctx.moveTo(x,y);
        started=true;
      }else{
        ctx.lineTo(x,y);
      }
    });

    ctx.stroke();
  }

  ma("ma5","#38bdf8");
  ma("ma10","#facc15");
  ma("ma20","#a78bfa");
  ma("ma60","#fb923c");

  ctx.fillStyle="#64748b";
  ctx.font="9px -apple-system";

  [
    0,
    Math.floor(data.length/2),
    data.length-1
  ].forEach(function(i){
    if(!data[i]) return;

    var x=left+i*step;

    ctx.fillText(
      String(data[i].date || "").slice(5),
      Math.min(x,W-42),
      H-5
    );
  });
}

document.querySelectorAll(".tab").forEach(function(btn){
  btn.addEventListener("click",function(){

    document.querySelectorAll(".tab").forEach(function(x){
      x.classList.remove("active");
    });

    btn.classList.add("active");

    filter=btn.dataset.filter;

    document.getElementById("title").textContent =
      btn.textContent.trim();

    render();
  });
});

document.getElementById("search").addEventListener(
  "input",
  function(e){
    keyword=e.target.value.trim();
    render();
  }
);

async function refreshStocks(){
  var pin=prompt("請輸入更新 PIN");

  if(!pin){
    return;
  }

  var btn=document.getElementById("refreshBtn");
  var status=document.getElementById("status");

  btn.disabled=true;
  btn.textContent="⏳ 正在啟動...";
  status.textContent="正在啟動 V4 掃描...";

  try{
    var response=await fetch(
      "https://taiwan-stock-refresh.blue780822.workers.dev/",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({pin:pin})
      }
    );

    var result=await response.json();

    if(!response.ok || !result.ok){
      throw new Error(
        result.message ||
        "啟動失敗"
      );
    }

    btn.textContent="✅ 已啟動選股";

    status.textContent=
      "掃描已開始，完成後重新整理即可查看最新資料。";

  }catch(err){
    btn.disabled=false;
    btn.textContent="🔄 立即更新選股";

    status.textContent=
      "❌ " + err.message;

    return;
  }

  setTimeout(function(){
    btn.disabled=false;
    btn.textContent="🔄 立即更新選股";
  },10000);
}

loadData();
</script>

</body>
</html>
