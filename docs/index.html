<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>台股起漲雷達 V4</title>

<style>
:root{
    --bg:#0b1220;
    --card:#131d2e;
    --card2:#182438;
    --text:#f1f5f9;
    --muted:#94a3b8;
    --line:#263449;
    --blue:#38bdf8;
    --green:#22c55e;
    --yellow:#f59e0b;
    --orange:#fb923c;
    --red:#ef4444;
    --purple:#a78bfa;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:18px 14px 60px;
}

.hero{
    text-align:center;
    padding:16px 0 12px;
}

.hero h1{
    margin:0;
    font-size:27px;
}

.hero p{
    color:var(--muted);
    margin:8px 0 0;
    font-size:14px;
}

.refresh-area{
    text-align:center;
    margin:16px 0;
}

.refresh-btn{
    border:0;
    border-radius:12px;
    padding:13px 22px;
    font-weight:800;
    font-size:15px;
    color:#06111c;
    background:var(--blue);
}

.refresh-btn:disabled{
    opacity:.55;
}

#refreshStatus{
    min-height:20px;
    margin-top:9px;
    color:var(--muted);
    font-size:13px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:16px 0;
}

.summary-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 8px;
    text-align:center;
}

.summary-value{
    font-weight:900;
    font-size:17px;
}

.summary-label{
    margin-top:5px;
    font-size:11px;
    color:var(--muted);
}

.tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:5px 0 13px;
    scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    flex:none;
    white-space:nowrap;
    border:1px solid var(--line);
    color:var(--muted);
    background:var(--card);
    border-radius:20px;
    padding:8px 13px;
    font-size:13px;
    font-weight:700;
}

.tab.active{
    background:var(--blue);
    border-color:var(--blue);
    color:#06111c;
}

.toolbar{
    display:flex;
    gap:8px;
    margin:3px 0 15px;
}

.search{
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:11px;
    padding:11px 12px;
    outline:none;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:16px 2px 10px;
}

.section-title h2{
    font-size:17px;
    margin:0;
}

#resultCount{
    font-size:12px;
    color:var(--muted);
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(300px,1fr));
    gap:12px;
}

.stock-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.stock-name{
    font-size:18px;
    font-weight:900;
}

.stock-code{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.price{
    font-size:20px;
    font-weight:900;
    text-align:right;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.badge{
    padding:5px 8px;
    border-radius:8px;
    background:var(--card2);
    color:var(--muted);
    font-size:11px;
}

.score-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.metric{
    background:var(--card2);
    border-radius:11px;
    padding:10px;
}

.metric-label{
    font-size:11px;
    color:var(--muted);
}

.metric-value{
    margin-top:4px;
    font-size:18px;
    font-weight:900;
}

.launch{
    color:var(--blue);
}

.stars{
    color:#facc15;
    letter-spacing:1px;
    font-size:15px;
}

.signal{
    margin-top:11px;
    padding:9px 10px;
    border-radius:10px;
    font-size:13px;
    font-weight:800;
}

.signal-buy{
    color:#86efac;
    background:rgba(34,197,94,.12);
}

.signal-wait{
    color:#fde68a;
    background:rgba(245,158,11,.12);
}

.signal-hot{
    color:#fdba74;
    background:rgba(251,146,60,.12);
}

.signal-weak{
    color:#fca5a5;
    background:rgba(239,68,68,.12);
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
    margin-top:11px;
}

.info{
    font-size:12px;
    color:var(--muted);
}

.info strong{
    color:var(--text);
}

.reason-box{
    margin-top:10px;
    font-size:12px;
    line-height:1.7;
    color:#cbd5e1;
}

.chart-button{
    width:100%;
    margin-top:13px;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card2);
    color:var(--blue);
    font-weight:800;
}

.chart-panel{
    display:none;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
}

.chart-panel.open{
    display:block;
}

.chart-wrap{
    width:100%;
    height:300px;
    position:relative;
}

canvas{
    width:100%;
    height:100%;
    border-radius:8px;
    background:#0d1726;
}

.chart-legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    color:var(--muted);
    font-size:10px;
    margin:8px 2px 0;
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:50px 10px;
}

.notice{
    margin-top:22px;
    color:var(--muted);
    font-size:11px;
    line-height:1.6;
    text-align:center;
}

@media(max-width:500px){
    .container{
        padding-left:11px;
        padding-right:11px;
    }

    .hero h1{
        font-size:24px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .chart-wrap{
        height:270px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="hero">
        <h1>🚀 台股起漲雷達 V4</h1>
        <p>
            技術結構・突破準備・量價動能・信心評比
        </p>
    </div>

    <div class="refresh-area">
        <button
            id="refreshBtn"
            class="refresh-btn"
            onclick="refreshStocks()"
        >
            🔄 立即更新選股
        </button>

        <div id="refreshStatus"></div>
    </div>

    <div class="summary">

        <div class="summary-box">
            <div
                class="summary-value"
                id="updated"
            >
                --
            </div>
            <div class="summary-label">
                最後更新
            </div>
        </div>

        <div class="summary-box">
            <div
                class="summary-value"
                id="universe"
            >
                --
            </div>
            <div class="summary-label">
                掃描股票
            </div>
        </div>

        <div class="summary-box">
            <div
                class="summary-value"
                id="selected"
            >
                --
            </div>
            <div class="summary-label">
                入選股票
            </div>
        </div>

    </div>

    <div class="tabs">

        <button
            class="tab active"
            data-filter="all"
        >
            🚀 起漲雷達
        </button>

        <button
            class="tab"
            data-filter="符合進場條件"
        >
            🎯 符合條件
        </button>

        <button
            class="tab"
            data-filter="等待突破確認"
        >
            🟡 等待突破
        </button>

        <button
            class="tab"
            data-filter="過熱／不追價"
        >
            ⚠️ 過熱不追
        </button>

        <button
            class="tab"
            data-filter="AI"
        >
            AI
        </button>

        <button
            class="tab"
            data-filter="半導體"
        >
            半導體
        </button>

        <button
            class="tab"
            data-filter="科技"
        >
            科技
        </button>

        <button
            class="tab"
            data-filter="ETF"
        >
            ETF
        </button>

    </div>

    <div class="toolbar">
        <input
            id="search"
            class="search"
            placeholder="搜尋股票名稱或代號..."
        >
    </div>

    <div class="section-title">
        <h2 id="sectionTitle">
            🚀 起漲雷達
        </h2>
        <span id="resultCount"></span>
    </div>

    <div
        id="stockGrid"
        class="grid"
    ></div>

    <div class="notice">
        本頁為量化技術訊號整理工具。
        Launch Score 與 Confidence
        代表條件與訊號的一致程度，
        並非未來上漲機率或報酬保證。
    </div>

</div>


<script>

let allStocks = [];
let currentFilter = "all";
let searchText = "";


// ======================================================
// Load V4 data
// ======================================================

async function loadData(){

    try{

        const response = await fetch(
            "data.json?t=" + Date.now()
        );

        if(!response.ok){
            throw new Error(
                "data.json 讀取失敗"
            );
        }

        const data = await response.json();

        allStocks = data.stocks || [];

        document.getElementById(
            "updated"
        ).textContent =
            data.updated || "--";

        document.getElementById(
            "universe"
        ).textContent =
            data.universe_count ?? "--";

        document.getElementById(
            "selected"
        ).textContent =
            data.count ?? allStocks.length;

        renderStocks();

    }catch(error){

        console.error(error);

        document.getElementById(
            "stockGrid"
        ).innerHTML =
            `<div class="empty">
                ❌ 無法讀取選股資料
            </div>`;
    }
}


// ======================================================
// Filter
// ======================================================

function getFilteredStocks(){

    let stocks = allStocks.filter(stock => {

        let filterMatch = false;

        if(currentFilter === "all"){

            filterMatch = true;

        }else if(
            [
                "符合進場條件",
                "等待突破確認",
                "過熱／不追價",
                "條件不足"
            ].includes(currentFilter)
        ){

            filterMatch =
                stock.signal === currentFilter;

        }else{

            filterMatch =
                (stock.groups || [])
                .includes(currentFilter);
        }

        const text =
            (
                (stock.code || "") +
                " " +
                (stock.name || "")
            ).toLowerCase();

        const searchMatch =
            text.includes(
                searchText.toLowerCase()
            );

        return (
            filterMatch &&
            searchMatch
        );
    });

    stocks.sort((a,b) => {

        if(
            (b.launch_score || 0) !==
            (a.launch_score || 0)
        ){
            return (
                (b.launch_score || 0) -
                (a.launch_score || 0)
            );
        }

        return (
            (b.confidence || 0) -
            (a.confidence || 0)
        );
    });

    return stocks;
}


// ======================================================
// Signal styling
// ======================================================

function signalClass(signal){

    if(signal === "符合進場條件"){
        return "signal-buy";
    }

    if(signal === "等待突破確認"){
        return "signal-wait";
    }

    if(signal === "過熱／不追價"){
        return "signal-hot";
    }

    return "signal-weak";
}


function signalIcon(signal){

    if(signal === "符合進場條件"){
        return "🟢";
    }

    if(signal === "等待突破確認"){
        return "🟡";
    }

    if(signal === "過熱／不追價"){
        return "🟠";
    }

    return "🔴";
}


function starText(stars){

    const n = Math.max(
        1,
        Math.min(
            5,
            Number(stars || 1)
        )
    );

    return (
        "★".repeat(n) +
        "☆".repeat(5-n)
    );
}


// ======================================================
// Render cards
// ======================================================

function renderStocks(){

    const stocks =
        getFilteredStocks();

    const grid =
        document.getElementById(
            "stockGrid"
        );

    document.getElementById(
        "resultCount"
    ).textContent =
        `${stocks.length} 檔`;

    if(stocks.length === 0){

        grid.innerHTML =
            `<div class="empty">
                沒有符合條件的股票
            </div>`;

        return;
    }

    grid.innerHTML =
        stocks.map(
            (stock,index) =>
                createStockCard(
                    stock,
                    index
                )
        ).join("");
}


function createStockCard(
    stock,
    index
){

    const groups =
        (stock.groups || [])
        .map(
            g =>
            `<span class="badge">${g}</span>`
        )
        .join("");

    const reasons =
        (
            stock.launch_reasons ||
            stock.reasons ||
            []
        )
        .slice(0,5)
        .map(
            r => `✓ ${r}`
        )
        .join("　");

    const signal =
        stock.signal ||
        "條件不足";

    const chartId =
        `chart-${stock.code}-${index}`;

    const panelId =
        `panel-${stock.code}-${index}`;

    return `
    <div class="stock-card">

        <div class="card-top">

            <div>
                <div class="stock-name">
                    ${stock.name}
                </div>

                <div class="stock-code">
                    ${stock.code}
                    ・
                    ${stock.market || ""}
                </div>
            </div>

            <div>
                <div class="price">
                    $${stock.price}
                </div>

                <div class="stock-code">
                    ${stock.date || ""}
                </div>
            </div>

        </div>

        <div class="badges">
            ${groups}
            <span class="badge">
                V3 ${stock.score ?? 0}/6
            </span>
        </div>

        <div class="score-row">

            <div class="metric">
                <div class="metric-label">
                    🚀 起漲分數
                </div>

                <div class="metric-value launch">
                    ${stock.launch_score ?? 0}
                    <small>/100</small>
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    ⭐ 信心評比
                </div>

                <div class="metric-value">
                    ${stock.confidence ?? 0}
                    <small>/100</small>
                </div>

                <div class="stars">
                    ${starText(
                        stock.confidence_stars
                    )}
                </div>
            </div>

        </div>

        <div
            class="signal
            ${signalClass(signal)}"
        >
            ${signalIcon(signal)}
            ${signal}
        </div>

        <div class="info-grid">

            <div class="info">
                RSI
                <strong>
                    ${stock.rsi ?? "--"}
                </strong>
            </div>

            <div class="info">
                量比
                <strong>
                    ${stock.volume_ratio ?? "--"}x
                </strong>
            </div>

            <div class="info">
                MA20乖離
                <strong>
                    ${stock.distance_ma20_pct ?? "--"}%
                </strong>
            </div>

            <div class="info">
                突破參考
                <strong>
                    $${stock.breakout_price ?? "--"}
                </strong>
            </div>

            <div class="info">
                參考區間
                <strong>
                    $${stock.entry_low ?? "--"}
                    ～
                    $${stock.entry_high ?? "--"}
                </strong>
            </div>

            <div class="info">
                風險參考
                <strong>
                    $${stock.risk_reference ?? "--"}
                </strong>
            </div>

        </div>

        <div class="reason-box">
            ${reasons}
        </div>

        <button
            class="chart-button"
            onclick="
                toggleChart(
                    '${panelId}',
                    '${chartId}',
                    '${stock.code}'
                )
            "
        >
            📊 查看 60 日 K 線
        </button>

        <div
            id="${panelId}"
            class="chart-panel"
        >

            <div class="chart-wrap">
                <canvas
                    id="${chartId}"
                ></canvas>
            </div>

            <div class="chart-legend">
                <span>━ MA5</span>
                <span>━ MA10</span>
                <span>━ MA20</span>
                <span>━ MA60</span>
                <span>▮ K線</span>
            </div>

        </div>

    </div>
    `;
}


// ======================================================
// Chart open
// ======================================================

function toggleChart(
    panelId,
    chartId,
    code
){

    const panel =
        document.getElementById(
            panelId
        );

    const opening =
        !panel.classList.contains(
            "open"
        );

    panel.classList.toggle(
        "open"
    );

    if(!opening){
        return;
    }

    const stock =
        allStocks.find(
            s => s.code === code
        );

    if(!stock){
        return;
    }

    setTimeout(
        () => drawChart(
            chartId,
            stock.chart || []
        ),
        30
    );
}


// ======================================================
// Pure Canvas candlestick chart
// ======================================================

function drawChart(
    canvasId,
    data
){

    const canvas =
        document.getElementById(
            canvasId
        );

    if(
        !canvas ||
        !data ||
        data.length === 0
    ){
        return;
    }

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    const ctx =
        canvas.getContext("2d");

    ctx.scale(
        dpr,
        dpr
    );

    const W = rect.width;
    const H = rect.height;

    const pad = {
        left:42,
        right:8,
        top:12,
        bottom:24
    };

    const chartW =
        W -
        pad.left -
        pad.right;

    const chartH =
        H -
        pad.top -
        pad.bottom;

    const priceH =
        chartH * 0.76;

    const volumeTop =
        pad.top +
        priceH +
        8;

    const volumeH =
        chartH -
        priceH -
        8;

    const allPrices = [];

    data.forEach(d => {

        [
            d.high,
            d.low,
            d.ma5,
            d.ma10,
            d.ma20,
            d.ma60
        ].forEach(v => {

            if(
                v !== null &&
                v !== undefined &&
                Number.isFinite(
                    Number(v)
                )
            ){
                allPrices.push(
                    Number(v)
                );
            }
        });
    });

    if(allPrices.length === 0){
        return;
    }

    let minPrice =
        Math.min(...allPrices);

    let maxPrice =
        Math.max(...allPrices);

    const range =
        Math.max(
            maxPrice-minPrice,
            1
        );

    minPrice -= range*0.05;
    maxPrice += range*0.05;

    const maxVolume =
        Math.max(
            ...data.map(
                d => Number(
                    d.volume || 0
                )
            ),
            1
        );

    const xStep =
        chartW /
        data.length;

    const candleWidth =
        Math.max(
            2,
            Math.min(
                7,
                xStep*0.6
            )
        );

    function yPrice(value){

        return (
            pad.top +
            (
                maxPrice-value
            ) /
            (
                maxPrice-minPrice
            ) *
            priceH
        );
    }

    // background
    ctx.clearRect(
        0,0,W,H
    );

    // grid
    ctx.strokeStyle =
        "rgba(148,163,184,.12)";

    ctx.lineWidth = 1;

    ctx.fillStyle =
        "#94a3b8";

    ctx.font =
        "10px -apple-system";

    for(let i=0;i<=4;i++){

        const y =
            pad.top +
            priceH*i/4;

        ctx.beginPath();

        ctx.moveTo(
            pad.left,
            y
        );

        ctx.lineTo(
            W-pad.right,
            y
        );

        ctx.stroke();

        const value =
            maxPrice -
            (
                maxPrice-minPrice
            )*i/4;

        ctx.fillText(
            value.toFixed(1),
            2,
            y+3
        );
    }

    // volume
    data.forEach(
        (d,i) => {

        const x =
            pad.left +
            i*xStep +
            xStep/2;

        const h =
            Number(d.volume || 0) /
            maxVolume *
            volumeH;

        const up =
            Number(d.close) >=
            Number(d.open);

        ctx.fillStyle =
            up
            ? "rgba(34,197,94,.45)"
            : "rgba(239,68,68,.45)";

        ctx.fillRect(
            x-candleWidth/2,
            volumeTop+
            volumeH-h,
            candleWidth,
            h
        );
    });

    // candles
    data.forEach(
        (d,i) => {

        const x =
            pad.left +
            i*xStep +
            xStep/2;

        const open =
            Number(d.open);

        const close =
            Number(d.close);

        const high =
            Number(d.high);

        const low =
            Number(d.low);

        const up =
            close >= open;

        ctx.strokeStyle =
            up
            ? "#22c55e"
            : "#ef4444";

        ctx.fillStyle =
            ctx.strokeStyle;

        ctx.lineWidth = 1;

        ctx.beginPath();

        ctx.moveTo(
            x,
            yPrice(high)
        );

        ctx.lineTo(
            x,
            yPrice(low)
        );

        ctx.stroke();

        const top =
            Math.min(
                yPrice(open),
                yPrice(close)
            );

        const bottom =
            Math.max(
                yPrice(open),
                yPrice(close)
            );

        ctx.fillRect(
            x-candleWidth/2,
            top,
            candleWidth,
            Math.max(
                1,
                bottom-top
            )
        );
    });


    function drawMA(
        key,
        color
    ){

        ctx.strokeStyle =
            color;

        ctx.lineWidth =
            1.4;

        ctx.beginPath();

        let started =
            false;

        data.forEach(
            (d,i) => {

            const value =
                d[key];

            if(
                value === null ||
                value === undefined
            ){
                return;
            }

            const x =
                pad.left +
                i*xStep +
                xStep/2;

            const y =
                yPrice(
                    Number(value)
                );

            if(!started){

                ctx.moveTo(
                    x,y
                );

                started = true;

            }else{

                ctx.lineTo(
                    x,y
                );
            }
        });

        ctx.stroke();
    }

    drawMA(
        "ma5",
        "#38bdf8"
    );

    drawMA(
        "ma10",
        "#facc15"
    );

    drawMA(
        "ma20",
        "#a78bfa"
    );

    drawMA(
        "ma60",
        "#fb923c"
    );

    // date labels
    ctx.fillStyle =
        "#64748b";

    ctx.font =
        "9px -apple-system";

    const labelIndexes = [
        0,
        Math.floor(
            data.length/2
        ),
        data.length-1
    ];

    labelIndexes.forEach(
        index => {

        const d =
            data[index];

        if(!d){
            return;
        }

        const x =
            pad.left +
            index*xStep;

        ctx.fillText(
            String(
                d.date
            ).slice(5),
            Math.min(
                x,
                W-42
            ),
            H-5
        );
    );
}

// ======================================================
// Refresh scanner
// ======================================================

async function refreshStocks(){

    const pin =
        prompt(
            "請輸入更新 PIN"
        );

    if(!pin){
        return;
    }

    const button =
        document.getElementById(
            "refreshBtn"
        );

    const status =
        document.getElementById(
            "refreshStatus"
        );

    button.disabled = true;

    button.textContent =
        "⏳ 正在啟動選股...";

    status.textContent =
        "正在啟動 V4 起漲雷達...";

    try{

        const response =
            await fetch(
                "https://taiwan-stock-refresh.blue780822.workers.dev/",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            pin:pin
                        })
                }
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.ok
        ){

            let message =
                data.message ||
                "更新失敗";

            if(data.status){
                message +=
                    " (" +
                    data.status +
                    ")";
            }

            throw new Error(
                message
            );
        }

        button.textContent =
            "✅ 已啟動選股";

        status.textContent =
            "V4 掃描已開始，完成後重新整理即可查看最新結果。";

        setTimeout(
            () => {

                button.disabled =
                    false;

                button.textContent =
                    "🔄 立即更新選股";
            },
            10000
        );

    }catch(error){

        console.error(
            error
        );

        button.disabled =
            false;

        button.textContent =
            "🔄 立即更新選股";

        status.textContent =
            "❌ 啟動失敗：" +
            error.message;
    }
}
