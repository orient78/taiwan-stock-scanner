<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台股技術面掃描</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:auto;padding:18px}
.hero{background:white;border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
h1{font-size:25px;margin:0 0 8px}.sub{color:#667085;font-size:14px;line-height:1.55}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.pill{background:#eef3f8;border-radius:999px;padding:8px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:14px}
.card{background:white;border-radius:18px;padding:16px;box-shadow:0 5px 22px rgba(0,0,0,.05)}
.top{display:flex;justify-content:space-between;gap:10px}.name{font-size:19px;font-weight:700}.code{font-size:13px;color:#667085;margin-top:3px}
.score{font-weight:800;font-size:18px}.price{font-size:26px;font-weight:750;margin:14px 0 8px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:13px;color:#475467}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.tag{font-size:12px;padding:6px 8px;border-radius:9px;background:#eef3f8}
.note{font-size:12px;color:#667085;margin-top:18px;line-height:1.5}.empty{background:white;padding:24px;border-radius:18px;margin-top:14px}
</style>
</head>
<body><div class="wrap">
<div class="hero">
<h1>台股技術面掃描</h1>
<div class="sub">每日收盤後自動更新。候選清單依技術條件排序，不代表報酬保證或自動買進建議。</div>
<div class="stats"><span class="pill" id="updated">讀取中…</span><span class="pill" id="count"></span></div>
</div>
<div class="grid" id="grid"></div>
<div class="note">條件：多頭排列（Close &gt; MA20 &gt; MA60 且 MA20 上升）、RSI(14) 50–70、MACD 動能增強、突破前 20 日高點、成交量 ≥ 20 日均量 × 1.5。Risk Ref 為 Close − 2×ATR(14)，僅作波動參考。</div>
</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
fetch("data.json?ts="+Date.now()).then(r=>r.json()).then(d=>{
 document.getElementById("updated").textContent="更新："+d.updated;
 document.getElementById("count").textContent="候選："+d.count+" 檔";
 const g=document.getElementById("grid");
 if(!d.stocks.length){g.innerHTML='<div class="empty">今天沒有符合門檻的股票。</div>';return;}
 g.innerHTML=d.stocks.map(s=>`<div class="card">
  <div class="top"><div><div class="name">${esc(s.name)}</div><div class="code">${esc(s.code)} · ${esc(s.market)}</div></div><div class="score">${s.score}/5</div></div>
  <div class="price">$${s.price}</div>
  <div class="metrics"><span>RSI ${s.rsi}</span><span>量比 ${s.volume_ratio}×</span><span>MA20 ${s.ma20}</span><span>MA60 ${s.ma60}</span><span>ATR14 ${s.atr14??"-"}</span><span>Risk Ref ${s.risk_reference??"-"}</span></div>
  <div class="reasons">${s.reasons.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>
 </div>`).join("");
}).catch(e=>{
 document.getElementById("grid").innerHTML='<div class="empty">尚未產生掃描資料。請先在 GitHub Actions 手動執行一次 Daily Taiwan Stock Scan。</div>';
});
</script></body></html>
